name: Refresh NVA snapshots (other Norwegian universities)

# Builds a separate NVA snapshot for each of the other nine Norwegian universities
# USN is compared against — one per parallel matrix job, not one long sequential loop,
# since a single institution's own fetch (USN) already needed year-slicing and a
# multi-tier fallback just to get through cleanly; running nine of those sequentially in
# one job would risk hitting GitHub Actions' runtime limit, especially with UiO and NTNU
# in the mix, both likely several times USN's own size.
#
# Institution codes are the same ones confirmed via a live diagnostic against Cristin's
# own API (see conversation) — not guessed. This list includes Nord universitet, not
# INN (University of Inland Norway) — the OpenAlex-side comparison list
# (NORWAY_UNIVERSITIES in the app) made the opposite choice; the two lists don't fully
# agree and that's been flagged rather than silently reconciled.
#
# Runs an hour after USN's own dedicated workflow (nva-snapshot.yml) — no dependency
# between them, just staggered so they're not both hammering GitHub Actions' shared
# runner capacity at exactly the same moment.
#
# Each matrix job uploads its own snapshot as a build artifact rather than committing
# directly — nine parallel jobs all trying to git push around the same time would race
# and mostly fail with non-fast-forward rejections, since each job's local history
# diverges the moment any one of them pushes first. A single downstream job collects
# every artifact and does one combined commit instead, avoiding that race entirely.
on:
  schedule:
    - cron: '0 4 1 * *'   # 04:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # one university hitting a server-side issue (NVA has already
                          # shown it can return persistent 500s for specific records —
                          # see USN's own history with this) shouldn't cancel the other
                          # eight jobs still in progress
      matrix:
        institution:
          - { id: '185', name: 'UiO' }
          - { id: '194', name: 'NTNU' }
          - { id: '184', name: 'UiB' }
          - { id: '186', name: 'UiT' }
          - { id: '192', name: 'NMBU' }
          - { id: '201', name: 'UiA' }
          - { id: '217', name: 'UiS' }
          - { id: '215', name: 'OsloMet' }
          - { id: '204', name: 'Nord' }
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build snapshot for ${{ matrix.institution.name }}
        env:
          NVA_INSTITUTION_ID: ${{ matrix.institution.id }}
        run: python build_nva_snapshot.py

      - name: Upload snapshot as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.institution.id }}
          path: data/nva-snapshot-${{ matrix.institution.id }}.json
          retention-days: 1
          if-no-files-found: error   # a missing output file means the build step
                                     # silently failed to write anything — that should
                                     # surface loudly here, not just vanish

  commit:
    needs: build
    if: always()   # commit whatever DID succeed even if one or more matrix legs
                    # failed — nine independent institutions, no reason a single
                    # failure should block committing the other eight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Download all snapshot artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: snapshot-*
          merge-multiple: true

      - name: Commit and push whichever snapshots changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/nva-snapshot-*.json; then
            echo "No changes to any snapshot — nothing to commit."
          else
            git add data/nva-snapshot-*.json
            git commit -m "Monthly NVA snapshot refresh (other Norwegian universities)"
            git push
          fi
