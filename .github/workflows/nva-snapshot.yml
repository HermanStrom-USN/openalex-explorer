name: Refresh NVA publication snapshot

# Monthly, plus a manual trigger for the first run and any ad-hoc refresh.
# Runs server-side, which is the whole point — NVA's /search/resources
# endpoint doesn't send CORS headers, so this data can't be pulled directly
# from the browser tool the way the OpenAlex data can.
on:
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build snapshot
        run: python build_nva_snapshot.py

      - name: Commit and push if the snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/nva-publications-snapshot.json; then
            echo "No changes to snapshot — nothing to commit."
          else
            git add data/nva-publications-snapshot.json
            git commit -m "Monthly NVA publication snapshot refresh"
            git push
          fi
